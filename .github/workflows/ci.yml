# Keyless: every test uses canaries, fake runners or saved snapshots.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catches runtime changes that break the tests
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv python install
      - run: uv sync --locked
      - run: uv run pytest -q
